# DeskUnify changes, 2026-10-01; derived from Lan Mouse, GPL-3.0-or-later.
[package]
name = "lan-mouse-egui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/mendes556/DeskUnify"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "accesskit", "x11", "wayland"] }
lan-mouse-ipc = { path = "../lan-mouse-ipc", version = "0.6.0" }
futures = "0.3"
tokio = { version = "1", features = ["rt", "time", "net", "sync"] }
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
